<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy.Client</title>
    <base href="/" />
    <link rel="stylesheet" href="css/app.css" />
    <!-- If you add any scoped CSS files, uncomment the following to load them
    <link href="Easy.Client.styles.css" rel="stylesheet" /> -->
</head>

<body>
    <div id="app">
        <svg class="loading-progress">
            <circle r="40%" cx="50%" cy="50%" />
            <circle r="40%" cx="50%" cy="50%" />
        </svg>
        <div class="loading-progress-text"></div>
    </div>

    <div id="blazor-error-ui">
        An unhandled error has occurred.
        <a href="." class="reload">Reload</a>
        <span class="dismiss">🗙</span>
    </div>
    <script src="_content/Microsoft.AspNetCore.Components.WebAssembly.Authentication/AuthenticationService.js"></script>
    <script>
        // Split view (S06, issue 36): the decrypted PDF as a blob URL for the native viewer in an iframe. show sets src
        // every time, so jumping to the same page again (after scrolling) still jumps.
        window.easyPdf = {
            url: async stream => URL.createObjectURL(new Blob([await stream.arrayBuffer()], { type: 'application/pdf' })),
            show: (frame, src) => { frame.src = src; },
            revoke: url => URL.revokeObjectURL(url),
        };
    </script>
    <!-- ponytail: plain name, no cache-busting fingerprint (index.html placeholders are replaced only in standalone apps, and MainApi hosts this one); serve a rewritten index.html from MainApi if stale scripts after a deploy bite -->
    <script src="_framework/blazor.webassembly.js"></script>
</body>

</html>
