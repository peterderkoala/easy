# Dev topology (S16). Start: cp .env.example .env && docker compose -f compose.dev.yml up --build
# Dev only: ports are published on 127.0.0.1. See compose.example.yml for a deployment template.
name: easy

networks:
  public: {}
  internal: {}

secrets:
  master_secret:
    file: ./secrets/master_secret

services:
  gateway:
    build: ./src/Easy.Gateway
    networks: [public, internal]
    ports: ["127.0.0.1:8080:8080"]
    depends_on: [main-api, exam-room]

  main-api:
    build: ./src/Easy.MainApi
    networks: [internal]
    secrets: [master_secret] # MainApi only (ADR 0001)
    environment:
      ConnectionStrings__Default: Host=postgres;Database=easy;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Rebus__Rabbit: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Seaweed__Endpoint: http://seaweedfs:8333
      Upload__MaxBytes: ${UPLOAD_MAX_BYTES:-15728640}
      MasterSecretFile: /run/secrets/master_secret
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      seaweedfs: {condition: service_healthy}
      keycloak: {condition: service_healthy}

  exam-room:
    build: ./src/Easy.ExamRoom
    networks: [internal]
    environment:
      ConnectionStrings__Default: Host=postgres;Database=easy;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Rebus__Rabbit: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
    depends_on: [main-api] # migrations run in main-api; add a healthcheck once /health exists

  notification:
    build: ./src/Easy.Notification
    networks: [internal]
    environment:
      ConnectionStrings__Default: Host=postgres;Database=easy;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Rebus__Rabbit: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Keycloak__ClientSecret: ${NOTIFICATION_CLIENT_SECRET}
      Smtp__Host: ${SMTP_HOST:-mailpit}
      Smtp__Port: ${SMTP_PORT:-1025}
      Smtp__User: ${SMTP_USER:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
    depends_on: [main-api, mailpit]

  scheduler:
    build: ./src/Easy.Scheduler
    networks: [internal]
    environment:
      ConnectionStrings__Default: Host=postgres;Database=easy;Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      Rebus__Rabbit: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq
      Keycloak__Authority: ${KEYCLOAK_AUTHORITY}
      Keycloak__ClientSecret: ${SCHEDULER_CLIENT_SECRET}
    depends_on: [main-api]

  postgres:
    image: postgres:17
    networks: [internal]
    ports: ["127.0.0.1:5432:5432"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: easy
    volumes: [postgres-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d easy"]
      interval: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management
    networks: [internal]
    ports: ["127.0.0.1:15672:15672"]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      retries: 10

  seaweedfs:
    # Pin a release that contains PR 11578 (presigned + SSE-C fix); verify in the SSE-C spike.
    image: chrislusf/seaweedfs:${SEAWEEDFS_TAG:-latest}
    command: server -s3 -dir=/data
    networks: [internal]
    volumes: [seaweedfs-data:/data]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9333/cluster/status >/dev/null"]
      interval: 10s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    command: start-dev --import-realm
    networks: [internal]
    ports: ["127.0.0.1:8081:8080"] # the browser logs in directly (S05)
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro # realm import file: spec ticket
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3; grep -q UP <&3"]
      interval: 10s
      retries: 20

  mailpit:
    image: axllent/mailpit
    networks: [internal]
    ports: ["127.0.0.1:8025:8025"]

volumes:
  postgres-data: {}
  seaweedfs-data: {}
